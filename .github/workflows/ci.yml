name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore API
        run: dotnet restore src/ProcessIA.API/ProcessIA.API.csproj

      - name: Restore Web
        run: dotnet restore src/ProcessIA.Web/ProcessIA.Web.csproj

      - name: Build API
        run: dotnet build src/ProcessIA.API/ProcessIA.API.csproj --no-restore -c Release

      - name: Build Web
        run: dotnet build src/ProcessIA.Web/ProcessIA.Web.csproj --no-restore -c Release

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f src/ProcessIA.API/Dockerfile -t processoia-api .

      - name: Build Web image
        run: docker build -f src/ProcessIA.Web/Dockerfile -t processoia-web .
